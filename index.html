<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Team Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header { text-align: center; padding: 30px 20px 10px; }

    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #00d4ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p { color: #888; margin-top: 6px; }

    .screen { width: 100%; max-width: 700px; padding: 0 20px 40px; }

    /* GAME AREA */
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }

    .input-group input, .input-group select {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 1rem;
    }

    .input-group input { width: 220px; }
    .input-group input:focus, .input-group select:focus { outline: none; border-color: #00d4ff; }

    /* MEMORY GAME */
    #memory-info {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .info-badge {
      background: #1a1a2e;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .info-badge span { color: #00d4ff; font-weight: 700; }

    #memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 450px;
      margin: 0 auto 20px;
    }

    .card {
      aspect-ratio: 1;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      user-select: none;
      transition: transform 0.3s;
      position: relative;
    }

    .card .card-inner {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      transition: transform 0.4s;
      transform-style: preserve-3d;
      position: absolute;
    }

    .card .card-front, .card .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
    }

    .card .card-back {
      background: linear-gradient(135deg, #7b2ff7, #5a1fb3);
      transform: rotateY(0deg);
      background-size: cover;
      background-position: center;
    }

    .card .card-front {
      background: #1a1a2e;
      border: 2px solid #333;
      transform: rotateY(180deg);
      font-size: 2.2rem;
      overflow: hidden;
    }

    .card .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .card .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }

    .card.matched .card-front {
      border-color: #00c853;
      background: #1b3a1b;
    }

    .card.matched { cursor: default; }

    #memory-complete {
      display: none;
      text-align: center;
      padding: 30px;
      background: #1a1a2e;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    #memory-complete h2 {
      font-size: 2rem;
      background: linear-gradient(135deg, #00d4ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    #memory-complete .stats { font-size: 1.2rem; color: #aaa; margin-bottom: 16px; }
    #memory-complete .stats span { color: #00d4ff; font-weight: 700; }

    .btn-start-memory {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00d4ff, #0090b3);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <h1>Operations Team Games</h1>
    <p>Play games, compete with your team, collect scores!</p>
  </header>

  <!-- MEMORY MATCH GAME -->
  <div id="screen-memory" class="screen active">
    <div class="input-group">
      <input type="text" id="player-name-memory" placeholder="Enter your name" maxlength="30" />
    </div>
    <div id="memory-info">
      <div class="info-badge">Moves: <span id="move-count">0</span></div>
      <div class="info-badge">Pairs: <span id="pair-count">0</span> / 8</div>
      <div class="info-badge">Time: <span id="memory-timer">0.0s</span></div>
    </div>
    <div id="memory-grid"></div>
    <div id="memory-complete">
      <h2>Complete!</h2>
      <div class="stats">
        Time: <span id="final-time">0</span>s &nbsp;|&nbsp; Moves: <span id="final-moves">0</span>
      </div>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn-start-memory" onclick="submitScore()" id="btn-submit-score">Submit Score</button>
        <button class="btn-start-memory" onclick="startMemoryGame()">Play Again</button>
      </div>
    </div>
    <div style="text-align:center;">
      <button class="btn-start-memory" id="btn-start-memory" onclick="startMemoryGame()">Start Game</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let scores = JSON.parse(localStorage.getItem('gameScores') || '[]');

    // ==================== MEMORY MATCH GAME ====================
    const EMOJIS = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '🥝', '🍑'];
    const IMAGES_DIR = 'game-images/';
    const NUM_PAIRS = 8;
    let customImages = null;
    let customBackImage = null;

    function preloadImages() {
      return new Promise((resolve) => {
        const imgs = [];
        let loaded = 0;
        let failed = 0;

        for (let i = 1; i <= NUM_PAIRS; i++) {
          const img = new Image();
          img.onload = () => { loaded++; imgs[i] = img.src; if (loaded + failed === NUM_PAIRS) finalize(); };
          img.onerror = () => { failed++; if (loaded + failed === NUM_PAIRS) finalize(); };
          img.src = IMAGES_DIR + 'card ' + i + '-png.png';
        }

        function finalize() {
          if (loaded === NUM_PAIRS) {
            customImages = [];
            for (let i = 1; i <= NUM_PAIRS; i++) customImages.push(imgs[i]);
          } else {
            customImages = null;
          }

          const backImg = new Image();
          backImg.onload = () => { customBackImage = backImg.src; resolve(); };
          backImg.onerror = () => { customBackImage = null; resolve(); };
          backImg.src = IMAGES_DIR + 'back.png';
        }
      });
    }

    let memoryCards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let memoryTimerInterval = null;
    let memoryStartTime = 0;
    let memoryLocked = false;

    async function startMemoryGame() {
      const name = document.getElementById('player-name-memory').value.trim();
      if (!name) {
        showToast('Please enter your name first!');
        document.getElementById('player-name-memory').focus();
        return;
      }

      document.getElementById('memory-complete').style.display = 'none';
      document.getElementById('btn-start-memory').style.display = 'none';

      await preloadImages();

      const useImages = customImages !== null;
      const symbols = useImages ? customImages : EMOJIS;
      const pairs = [...symbols, ...symbols];
      memoryCards = pairs.sort(() => Math.random() - 0.5);
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      memoryLocked = false;

      document.getElementById('move-count').textContent = '0';
      document.getElementById('pair-count').textContent = '0';
      document.getElementById('memory-timer').textContent = '0.0s';

      const grid = document.getElementById('memory-grid');
      grid.innerHTML = '';
      memoryCards.forEach((symbol, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = i;
        card.dataset.value = symbol;

        const backContent = customBackImage
          ? '<img src="' + customBackImage + '" alt="">'
          : '';
        const frontContent = useImages
          ? '<img src="' + symbol + '" alt="">'
          : symbol;

        card.innerHTML =
          '<div class="card-inner">' +
            '<div class="card-back">' + backContent + '</div>' +
            '<div class="card-front">' + frontContent + '</div>' +
          '</div>';
        card.addEventListener('click', () => flipCard(card));
        grid.appendChild(card);
      });

      clearInterval(memoryTimerInterval);
      memoryStartTime = performance.now();
      memoryTimerInterval = setInterval(() => {
        const elapsed = ((performance.now() - memoryStartTime) / 1000).toFixed(1);
        document.getElementById('memory-timer').textContent = elapsed + 's';
      }, 100);
    }

    function flipCard(card) {
      if (memoryLocked) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
      if (flippedCards.length >= 2) return;

      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('move-count').textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      if (c1.dataset.value === c2.dataset.value) {
        c1.classList.add('matched');
        c2.classList.add('matched');
        matchedPairs++;
        document.getElementById('pair-count').textContent = matchedPairs;
        flippedCards = [];
        if (matchedPairs === 8) completeMemoryGame();
      } else {
        memoryLocked = true;
        setTimeout(() => {
          c1.classList.remove('flipped');
          c2.classList.remove('flipped');
          flippedCards = [];
          memoryLocked = false;
        }, 800);
      }
    }

    function completeMemoryGame() {
      clearInterval(memoryTimerInterval);
      const elapsedSec = ((performance.now() - memoryStartTime) / 1000).toFixed(1);
      const elapsedMs = Math.round(elapsedSec * 1000);
      const name = document.getElementById('player-name-memory').value.trim();

      document.getElementById('final-time').textContent = elapsedSec;
      document.getElementById('final-moves').textContent = moves;
      document.getElementById('memory-complete').style.display = 'block';

      lastScore = {
        name: name,
        game: 'Incompliance Match',
        score: elapsedMs,
        scoreLabel: elapsedSec + 's / ' + moves + ' moves',
        details: { time_ms: elapsedMs, moves: moves },
        date: new Date().toLocaleString(),
        time: elapsedSec + 's',
        moves: moves
      };

      scores.push(lastScore);
      saveScores();
      document.getElementById('btn-submit-score').style.display = 'inline-block';
      document.getElementById('btn-submit-score').textContent = 'Submit Score';
      document.getElementById('btn-submit-score').style.background = '';
      showToast('Score saved: ' + elapsedSec + 's with ' + moves + ' moves');
    }

    // ==================== SHARED ====================
    let lastScore = null;

    function saveScores() {
      const best = {};
      scores.forEach(s => {
        const key = s.name.toLowerCase() + '|' + s.game;
        if (!best[key] || s.score < best[key].score) {
          best[key] = s;
        }
      });
      scores = Object.values(best).sort((a, b) => a.score - b.score);
      localStorage.setItem('gameScores', JSON.stringify(scores));
    }

    function emailScore(fields, subject) {
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = 'https://formsubmit.co/syafiqah.khairi@kopikenangan.com';
      form.target = '_blank';

      for (const [key, value] of Object.entries(fields)) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = value;
        form.appendChild(input);
      }

      const subjectInput = document.createElement('input');
      subjectInput.type = 'hidden';
      subjectInput.name = '_subject';
      subjectInput.value = subject;
      form.appendChild(subjectInput);

      const templateInput = document.createElement('input');
      templateInput.type = 'hidden';
      templateInput.name = '_template';
      templateInput.value = 'table';
      form.appendChild(templateInput);

      const captchaInput = document.createElement('input');
      captchaInput.type = 'hidden';
      captchaInput.name = '_captcha';
      captchaInput.value = 'false';
      form.appendChild(captchaInput);

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);
    }

    function submitScore() {
      if (!lastScore) {
        showToast('No score to submit. Play a game first!');
        return;
      }

      const btn = document.getElementById('btn-submit-score');
      const originalText = btn.textContent;
      btn.textContent = 'SENDING...';
      btn.style.background = 'linear-gradient(135deg, #ffb300, #ffd700)';
      btn.disabled = true;

      const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBmimSE7LBxyQPze71Z1MtvgWiMZPm2M1lItNVQ7-BbDtD1mFJVjcMwComMotJOJdGww/exec';

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          playerName: lastScore.name,
          game: lastScore.game,
          date: lastScore.date,
          score: lastScore.scoreLabel,
          time: lastScore.time,
          moves: lastScore.moves
        })
      })
      .then(() => {
        btn.textContent = 'SENT!';
        btn.style.background = 'linear-gradient(135deg, #69f0ae, #00c853)';
        showToast('Score submitted for ' + lastScore.name + '!');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = '';
          btn.disabled = false;
        }, 3000);
      })
      .catch(err => {
        console.error('Submit error:', err);
        btn.textContent = 'FAILED - TRY AGAIN';
        btn.style.background = 'linear-gradient(135deg, #ff5252, #c62828)';
        showToast('Failed to submit score. Please try again.');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = '';
          btn.disabled = false;
        }, 3000);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
